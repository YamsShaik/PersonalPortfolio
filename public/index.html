<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1124" />

    <!-- Title and search description -->
    <title>Shaik Yams | DevOps Engineer &amp; AWS Specialist</title>
    <meta
      name="description"
      content="Shaik Yams – DevOps Engineer and AWS specialist. Portfolio of CI/CD pipelines, Kubernetes, Terraform and cloud infrastructure projects."
    />
    <meta
      name="keywords"
      content="Shaik Yams, DevOps Engineer, AWS, Kubernetes, Terraform, CI/CD, Docker, Jenkins, GitHub Actions, Cloud Engineer, portfolio"
    />
    <meta name="author" content="Shaik Yams" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://shaik-yams.vercel.app/" />

    <!-- Icons and manifest -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/devops.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link previews: WhatsApp, LinkedIn, Facebook, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shaik Yams" />
    <meta property="og:title" content="Shaik Yams | DevOps Engineer &amp; AWS Specialist" />
    <meta
      property="og:description"
      content="CI/CD pipelines, Kubernetes, Terraform and cloud infrastructure projects."
    />
    <meta property="og:url" content="https://shaik-yams.vercel.app/" />
    <meta property="og:image" content="https://shaik-yams.vercel.app/preview.png" />

    <!-- Link previews: X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shaik Yams | DevOps Engineer &amp; AWS Specialist" />
    <meta
      name="twitter:description"
      content="CI/CD pipelines, Kubernetes, Terraform and cloud infrastructure projects."
    />
    <meta name="twitter:image" content="https://shaik-yams.vercel.app/preview.png" />

    <!-- Structured data so Google understands who this site is about -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Shaik Yams",
        "jobTitle": "DevOps Engineer",
        "url": "https://shaik-yams.vercel.app/",
        "sameAs": ["https://github.com/YamsShaik"],
        "knowsAbout": ["AWS", "Kubernetes", "Terraform", "CI/CD", "Docker", "DevOps"]
      }
    </script>

    <!-- Fonts used across the site: one request instead of one per component -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Dark background from the first paint, so there is no white flash -->
    <style>
      html {
        background: #0b1124;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #0b1124;
      }
      /* Loader shown until React mounts, then replaced automatically */
      .boot {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .boot span {
        width: 34px;
        height: 34px;
        border: 3px solid #28345f;
        border-top-color: #7c8cff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot span {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="margin: 0; padding: 2rem; color: #eef1ff; font-family: system-ui, sans-serif">
        Shaik Yams, DevOps Engineer. Please enable JavaScript to view this portfolio.
      </p>
    </noscript>

    <div id="root">
      <div class="boot" role="status" aria-label="Loading"><span></span></div>
    </div>
  </body>
</html>
